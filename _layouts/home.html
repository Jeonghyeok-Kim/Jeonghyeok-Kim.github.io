---
layout: default
---
{% assign p = site.profile %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ p.name }}","alternateName":["金楨赫","김정혁"],
 "jobTitle":"Assistant Research Fellow",
 "affiliation":{"@type":"Organization","name":"{{ p.institution }}","url":"{{ p.institution_url }}"},
 "alumniOf":[{"@type":"CollegeOrUniversity","name":"University of Houston"},{"@type":"CollegeOrUniversity","name":"Seoul National University"}],
 "knowsAbout":["Labor economics","Economics of education","Health economics"],
 "url":"{{ site.url }}/","sameAs":["{{ p.scholar }}"]}
</script>

<section class="intro">
  <aside class="profile">
    <div class="photo-frame">
      <img src="{{ p.photo | relative_url }}" alt="{{ p.name }}" onerror="this.remove()">
      <span class="initials" aria-hidden="true">JK</span>
    </div>
    <h1 class="profile-name">{{ p.name }}</h1>
    <p class="profile-role">{% for line in p.title_lines %}{{ line }}{% unless forloop.last %}<br>{% endunless %}{% endfor %}</p>
  </aside>

  <div class="intro-text prose">
    {{ content }}
  </div>
</section>
