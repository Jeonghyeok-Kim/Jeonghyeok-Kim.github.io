---
layout: default
---
{% assign p = site.profile %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ p.name }}","alternateName":["金楨赫","김정혁"],
 "jobTitle":"Assistant Research Fellow",
 "affiliation":{"@type":"Organization","name":"{{ p.institution }}","url":"{{ p.institution_url }}"},
 "alumniOf":[{"@type":"CollegeOrUniversity","name":"University of Houston"},{"@type":"CollegeOrUniversity","name":"Seoul National University"}],
 "knowsAbout":["Labor economics","Economics of education","Health economics"],
 "url":"{{ site.url }}/","sameAs":["{{ p.scholar }}"]}
</script>

<section class="intro">
  <aside class="intro-card">
    <div class="photo-frame">
      <img src="{{ p.photo | relative_url }}" alt="{{ p.name }}"
           onerror="this.remove()">
      <span class="initials" aria-hidden="true">JK</span>
    </div>
    <dl class="contact">
      <dt>Email</dt>
      <dd><a href="mailto:{{ p.email }}">{{ p.email }}</a>{% if p.email_alt %}<br><a href="mailto:{{ p.email_alt }}">{{ p.email_alt }}</a>{% endif %}</dd>
      <dt>Profiles</dt>
      <dd><a href="{{ p.cv | relative_url }}">CV (PDF)</a> · <a href="{{ p.scholar }}">Google Scholar</a></dd>
      <dt>Office</dt>
      <dd>{{ p.institution }}<br>{{ p.address }}</dd>
    </dl>
  </aside>

  <div class="intro-text">
    <p class="eyebrow">{{ p.name_alt }}</p>
    <h1>{{ p.name }}</h1>
    <p class="role">{{ p.position }}<br><a href="{{ p.institution_url }}">{{ p.institution }}</a></p>
    <div class="prose">
      {{ content }}
    </div>
  </div>

</section>
